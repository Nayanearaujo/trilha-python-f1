site_name: Trilha Python F1
site_description: Dashboard de Formula 1 com as 5 voltas mais rapidas por circuito (OpenF1).
repo_url: https://github.com/Nayanearaujo/trilha-python-f1
repo_name: Nayanearaujo/trilha-python-f1

theme:
  name: material
  language: pt-BR
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Modo claro
  features:
    - navigation.sections
    - content.code.copy

nav:
  - Inicio: index.md
  - API OpenF1: API.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
